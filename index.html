<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f4eb">
  <meta name="description" content="Fais glisser les blocs pour amener le bloc rouge dans la zone verte. Un petit casse-tête à jouer au doigt ou à la souris.">
  <title>casse-tete</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23295744'/%3E%3Ctext x='32' y='45' font-size='42' text-anchor='middle' fill='%23fff'%3E♻%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8 4 3 9l5 5M3 9h11a6 6 0 0 1 0 12h-3"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M20 7V2m0 5h-5M20 7a9 9 0 1 0 1 9"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m5 12 14 0m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-recycle" viewBox="0 0 32 32"><path d="m12 7 3-5 5 8m-1-5 1 5-5-1M24 13l5 8H19m5 3-5-3 3-4M15 26H5l5-9m-5 2 5-2 2 5"/></symbol>
  </svg>
  <main>
    <section class="intro">
      <p>Amène le bloc rouge dans la zone verte.</p>
    </section>
    <section class="game-layout" aria-label="Jeu de blocs coulissants">
      <div class="game-card">
        <div class="board-wrap">
          <div class="board" id="board" role="group" aria-label="Plateau : déplace les blocs avec le doigt, la souris ou les flèches du clavier.">
            <div id="floor" aria-hidden="true"></div>
            <div class="goal" aria-hidden="true"><span>ARRIVÉE</span></div>
            <div id="pieces"></div>
          </div>
        </div>
        <div class="game-bottomline"><span><span class="drag-dot">↔</span> Fais glisser les blocs</span></div>
      </div>
      <aside class="side-panel">
        <div class="score-row"><div><span class="metric-label">COUPS</span><strong id="moves">00</strong></div><div><span class="metric-label">RECORD</span><strong id="best" class="best-score">—</strong></div></div>
        <div class="action-row"><button id="undo" class="action-button" disabled><svg><use href="#i-undo"/></svg>Annuler</button><button id="reset" class="action-button"><svg><use href="#i-reset"/></svg>Recommencer</button></div>
        <div class="message" id="message" role="status" aria-live="polite"></div>
        <div class="keyboard-controls"><span id="selected-label">Sélectionne un bloc pour le déplacer.</span><div class="direction-buttons" aria-label="Déplacer le bloc sélectionné"><button data-dir="3" aria-label="Déplacer à gauche" disabled>←</button><button data-dir="0" aria-label="Déplacer vers le haut" disabled>↑</button><button data-dir="2" aria-label="Déplacer vers le bas" disabled>↓</button><button data-dir="1" aria-label="Déplacer à droite" disabled>→</button></div><span class="keyboard-note">Le clavier fonctionne aussi.</span></div>
      </aside>
    </section>
  </main>
  <div class="win-overlay" id="win" hidden role="dialog" aria-modal="true" aria-labelledby="win-title" tabindex="-1"><div class="win-card"><div class="win-illustration"><svg><use href="#i-recycle"/></svg><span>✦</span></div><span class="section-number">MISSION ACCOMPLIE</span><h2 id="win-title">Place nette !</h2><p id="win-message"></p><p class="new-record" id="new-record" hidden>Nouveau record. Bien joué !</p><button id="replay" class="replay-button">On remet ça ?<svg><use href="#i-arrow"/></svg></button><button id="view-board" class="view-board">Voir le plateau</button></div></div>
  <script type="module" src="./game.js"></script>
</body>
</html>
